name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Full test suite (locked dependencies)
    runs-on: ubuntu-latest
    # Prior run reached 63% in 782s plus 128s affected checks. A 20-minute
    # ceiling cannot accommodate that measured gate; retain bounded headroom.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --python python3.11 --extra dev --extra sdk --extra ingestion --extra tray

      - name: Check affected portable recovery group
        env:
          PYSTRAY_BACKEND: dummy
        # Collect this known portability class together, not one failure per
        # candidate. The original full-suite gate below remains required.
        run: >-
          uv run --frozen pytest -q -o faulthandler_timeout=60
          tests/test_recovery_fixture.py
          tests/test_classification_jobs.py
          tests/test_memory_placement.py
          tests/test_historical_batch_jobs.py
          tests/test_historical_batch_repairs.py
          tests/test_retained_analysis_reply.py
          tests/test_paid_history_recovery.py
          tests/test_credential_zdr.py
          tests/test_verify_history_backup_sections.py
          tests/test_paid_reload_fence.py
          tests/test_recovery_pool.py

      - name: Run tests
        env:
          # No display on CI runners; pystray's dummy backend lets tray imports load.
          PYSTRAY_BACKEND: dummy
        # Fail promptly with the real assertion; show Python stacks if a test
        # stalls instead of consuming the entire job with buffered dot output.
        run: uv run --frozen pytest -q --maxfail=1 -o faulthandler_timeout=60

  clean-install:
    name: Clean install imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package without extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Import the server and core modules
        # Catches runtime imports that are missing from declared dependencies.
        run: python -c "import server, muninn.core.memory, muninn.mcp.server, muninn.scoring.adaptive; print('imports ok')"
